name: Publish and deploy SecureMail API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/groy416/securemail-ml-backend

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Load VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure VPS host verification
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_HOST_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_HOST_KEY" > "$HOME/.ssh/known_hosts"

      - name: Copy deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          app_dir="${VPS_APP_DIR:-/opt/securemailscope}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$port" \
            "$VPS_USER@$VPS_HOST" "mkdir -p '$app_dir'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$port" \
            compose.yaml deploy/vps/deploy.sh deploy/vps/env.example \
            "$VPS_USER@$VPS_HOST:$app_dir/"

      - name: Pull and restart VPS service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          app_dir="${VPS_APP_DIR:-/opt/securemailscope}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$port" \
            "$VPS_USER@$VPS_HOST" \
            "cd '$app_dir' && chmod 700 deploy.sh && IMAGE_TAG='sha-${GITHUB_SHA}' GHCR_IMAGE='${IMAGE_NAME}' ./deploy.sh"
