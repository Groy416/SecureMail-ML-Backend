[project]
name = "securemailscope-ml"
version = "0.1.0"
description = "SecureMailScope ML pipeline and synthetic dataset tooling"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.0",
    "shap>=0.51.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
