[project]
name = "securemailscope-ml"
version = "0.1.0"
description = "SecureMailScope ML pipeline and synthetic dataset tooling"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.9.0",
    "shap>=0.51.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.34.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
